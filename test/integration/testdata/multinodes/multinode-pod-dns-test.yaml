apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox
  labels:
    app: busybox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: busybox
  template:
    metadata:
      labels:
        app: busybox
    spec:
      containers:
      - name: busybox
        # agnhost includes dig, which queries DNS and prints the address.
        image: registry.k8s.io/e2e-test-images/agnhost:2.40
        command:
          - sleep
          - "3600"
        imagePullPolicy: IfNotPresent
        securityContext:
          capabilities:
            add: ["NET_RAW"]
      restartPolicy: Always
      affinity:
        # ⬇⬇⬇ This ensures pods will land on separate hosts
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions: [{ key: app, operator: In, values: [busybox] }]
            topologyKey: "kubernetes.io/hostname"
