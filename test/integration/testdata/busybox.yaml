apiVersion: v1
kind: Pod
metadata:
  name: busybox
  labels:
    integration-test: busybox
spec:
  containers:
    - image: busybox:latest
      # Trap TERM so delete does not wait out the 30s grace period.
      command: ["sh", "-c", "trap exit TERM; sleep infinity & wait"]
      imagePullPolicy: IfNotPresent
      name: busybox
  restartPolicy: Always
