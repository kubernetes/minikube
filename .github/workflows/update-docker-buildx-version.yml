name: "update-docker-buildx-version"
on:
  workflow_dispatch:
  schedule:
    # every Saturday at 1:00 Pacific/8:00 UTC
    - cron: "0 8 * * 6"
permissions:
  contents: read

jobs:
  bump-docker-buildx-version:
    uses: ./.github/workflows/update-dependency.yml
    with:
      dep: docker-buildx
      title: "ISO: Update docker-buildx from {OLD_VERSION} to {NEW_VERSION}"
      branch: auto_bump_docker_buildx_version
      branch-suffix: short-commit-hash
      release-url: https://github.com/docker/buildx/releases
      ok-to-build-iso: true
      workflow-file: update-docker-buildx-version.yml
    secrets: inherit
