name: "update-gcp-auth-version"
on:
  workflow_dispatch:
  schedule:
    # every Saturday at 1:00 Pacific/8:00 UTC
    - cron: "0 8 * * 6"
permissions:
  contents: read

jobs:
  bump-gcp-auth-version:
    uses: ./.github/workflows/update-dependency.yml
    with:
      dep: gcp-auth
      title: "Addon gcp-auth: Update k8s-minikube/gcp-auth-webhook image from {OLD_VERSION} to {NEW_VERSION}"
      branch: auto_bump_gcp_auth_version
      labels: ok-to-test
      release-url: https://github.com/GoogleContainerTools/gcp-auth-webhook
      workflow-file: update-gcp-auth-version.yml
    secrets: inherit
