name: "update-nvidia-device-plugin-version"
on:
  workflow_dispatch:
  schedule:
    # every Saturday at 1:00 Pacific/8:00 UTC
    - cron: "0 8 * * 6"
permissions:
  contents: read

jobs:
  bump-nvidia-device-plugin-version:
    uses: ./.github/workflows/update-dependency.yml
    with:
      dep: nvidia-device-plugin
      title: "Addon nvidia-device-plugin: Update nvidia/k8s-device-plugin image from {OLD_VERSION} to {NEW_VERSION}"
      branch: auto_bump_nvidia_device_plugin_version
      labels: ok-to-test
      release-url: https://github.com/NVIDIA/k8s-device-plugin
      workflow-file: update-nvidia-device-plugin-version.yml
    secrets: inherit
