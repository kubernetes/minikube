name: "update-inspektor-gadget-version"
on:
  workflow_dispatch:
  schedule:
    # every Saturday at 1:00 Pacific/8:00 UTC
    - cron: "0 8 * * 6"
permissions:
  contents: read

jobs:
  bump-inspektor-gadget-version:
    uses: ./.github/workflows/update-dependency.yml
    with:
      dep: inspektor-gadget
      title: "Addon inspektor-gadget: Update inspektor-gadget image from {OLD_VERSION} to {NEW_VERSION}"
      branch: auto_bump_inspektor_gadget_version
      labels: ok-to-test
      release-url: https://github.com/inspektor-gadget/inspektor-gadget
      workflow-file: update-inspektor-gadget-version.yml
    secrets: inherit
