name: "update-flannel-version"
on:
  workflow_dispatch:
  schedule:
    # every Saturday at 1:00 Pacific/8:00 UTC
    - cron: "0 8 * * 6"
permissions:
  contents: read

jobs:
  bump-flannel-version:
    uses: ./.github/workflows/update-dependency.yml
    with:
      dep: flannel
      title: "CNI: Update flannel from {OLD_VERSION} to {NEW_VERSION}"
      labels: ok-to-test
      release-url: https://github.com/flannel-io/flannel
      workflow-file: update-flannel-version.yml
    secrets: inherit
