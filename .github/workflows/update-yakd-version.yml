name: "update-yakd-version"
on:
  workflow_dispatch:
  schedule:
    # every Saturday at 1:00 Pacific/8:00 UTC
    - cron: "0 8 * * 6"
permissions:
  contents: read

jobs:
  bump-yakd-version:
    uses: ./.github/workflows/update-dependency.yml
    with:
      dep: yakd
      title: "Addon yakd: Update manusa/yakd image from {OLD_VERSION} to {NEW_VERSION}"
      labels: ok-to-test
      release-url: https://github.com/manusa/yakd
      workflow-file: update-yakd-version.yml
    secrets: inherit
