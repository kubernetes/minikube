name: "update-cloud-spanner-emulator-version"
on:
  workflow_dispatch:
  schedule:
    # every Saturday at 1:00 Pacific/8:00 UTC
    - cron: "0 8 * * 6"
permissions:
  contents: read

jobs:
  bump-cloud-spanner-emulator-version:
    uses: ./.github/workflows/update-dependency.yml
    with:
      dep: cloud-spanner-emulator
      title: "Addon cloud-spanner: Update cloud-spanner-emulator/emulator image from {OLD_VERSION} to {NEW_VERSION}"
      branch: auto_bump_cloud_spanner_emulator_version
      labels: ok-to-test
      release-url: https://github.com/GoogleCloudPlatform/cloud-spanner-emulator
      workflow-file: update-cloud-spanner-emulator-version.yml
    secrets: inherit
