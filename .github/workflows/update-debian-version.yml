name: "update-debian-version"
on:
  workflow_dispatch:
  schedule:
    # every Saturday at 1:00 Pacific/8:00 UTC
    - cron: "0 8 * * 6"
permissions:
  contents: read

jobs:
  bump-ubuntu-version:
    uses: ./.github/workflows/update-dependency.yml
    with:
      dep: debian
      title: "Kicbase: Bump debian:bookworm from {OLD_VERSION} to {NEW_VERSION}"
      ok-to-build-image: true
      workflow-file: update-debian-version.yml
    secrets: inherit
