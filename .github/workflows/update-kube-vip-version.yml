name: "update-kube-vip-version"
on:
  workflow_dispatch:
  schedule:
    # every Saturday at 1:00 Pacific/8:00 UTC
    - cron: "0 8 * * 6"
permissions:
  contents: read

jobs:
  bump-kube-vip-version:
    uses: ./.github/workflows/update-dependency.yml
    with:
      dep: kube-vip
      title: "HA (multi-control plane): Update kube-vip from {OLD_VERSION} to {NEW_VERSION}"
      branch: auto_bump_kube_vip_version
      labels: ok-to-test
      release-url: https://github.com/kube-vip/kube-vip
      workflow-file: update-kube-vip-version.yml
    secrets: inherit
