name: "update-istio-operator-version"
on:
  workflow_dispatch:
  schedule:
    # every Saturday at 1:00 Pacific/8:00 UTC
    - cron: "0 8 * * 6"
permissions:
  contents: read

jobs:
  bump-istio-operator-version:
    uses: ./.github/workflows/update-dependency.yml
    with:
      dep: istio-operator
      title: "Addon istio-provisioner: Update istio/operator image from {OLD_VERSION} to {NEW_VERSION}"
      branch: auto_bump_istio_operator_version
      labels: ok-to-test
      release-url: https://github.com/istio/istio
      workflow-file: update-istio-operator.yml
    secrets: inherit
