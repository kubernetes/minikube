# Functional Test is a subset of minikube integration test, testing the most essential features of minikube.
name: Functional Test
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "go.mod"
      - "**.go"
      - "Makefile"
      - .github/workflows/functional_test.yml
      - "!site/**"
      - "!**.md"
      - "!**.json"
  push:
    branches: [ master ]
    paths:
      - "go.mod"
      - "**.go"
      - "Makefile"
      - "!site/**"
      - "!**.md"
      - "!**.json"
# Limit one functional test job running per PR/Branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # For example, if you push multiple commits to a pull request in quick succession, only the latest workflow run will continue
  cancel-in-progress: true
env:
  GOPROXY: https://proxy.golang.org
  GO_VERSION: '1.27.3'
permissions:
  contents: read
jobs:
  # build-test-binaries job runs before all other jobs and produces binaries/test-data per arch to be shared by all following jobs
  build-test-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build-test-binaries-x86
            arch: amd64
            runs-on: ubuntu-24.04
            make-targets: e2e-linux-amd64
          - name: build-test-binaries-arm
            arch: arm64
            runs-on: ubuntu-24.04-arm
            make-targets: e2e-linux-arm64
    runs-on: ${{ matrix.runs-on }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        timeout-minutes: 2
        with:
          go-version: ${{env.GO_VERSION}}
          cache: true      
      - name: Download Dependencies
        timeout-minutes: 1
        run: go mod download
      - name: Build minikube and e2e test binaries
        timeout-minutes: 7
        run: |
          make ${{ matrix.make-targets }}
          cp -r test/integration/testdata ./out
      - name: Upload Test Binaries
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: binaries-${{ matrix.arch }}
          path: out
  functional-test:
    name: ${{ matrix.name }}
    needs: build-test-binaries
    runs-on: ${{ matrix.os }}
    permissions:
      contents: none
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: docker-docker-ubuntu24.04-x86
            driver: docker
            cruntime: docker
            extra-start-args: --container-runtime=docker
            os: ubuntu-24.04
            arch: amd64
          - name: docker-docker-ubuntu24.04-arm
            driver: docker
            cruntime: docker
            extra-start-args: --container-runtime=docker
            os: ubuntu-24.04-arm
            arch: arm64
          - name: docker-containerd-ubuntu-24.04-x86
            driver: docker
            cruntime: containerd
            extra-start-args: --container-runtime=containerd
            os: ubuntu-24.04
            arch: amd64
          - name: docker-containerd-ubuntu-24.04-arm
            driver: docker
            cruntime: containerd
            extra-start-args: --container-runtime=containerd
            os: ubuntu-24.04-arm
            arch: arm64
          - name: docker-containerd-rootless-ubuntu-24.04-x86
            driver: docker
            cruntime: containerd
            os: ubuntu-24.04
            extra-start-args: --container-runtime=containerd --rootless
            rootless: true
            arch: amd64
          - name: podman-crio-ubuntu-24.04-x86
            driver: podman
            cruntime: crio
            extra-start-args: --container-runtime=crio
            os: ubuntu-24.04
            arch: amd64
          - name: podman-crio-ubuntu-24.04-arm
            driver: podman
            cruntime: crio
            extra-start-args: --container-runtime=crio
            os: ubuntu-24.04-arm
            arch: arm64
          - name: podman-containerd-ubuntu-24.04-x86
            driver: podman
            cruntime: containerd
            extra-start-args: --container-runtime=containerd
            os: ubuntu-24.04
            arch: amd64
          - name: podman-containerd-ubuntu-24.04-arm
            driver: podman
            cruntime: containerd
            extra-start-args: --container-runtime=containerd
            os: ubuntu-24.04-arm
            arch: arm64
          - name: baremetal-docker-ubuntu-24.04-x86
            driver: none
            cruntime: docker
            extra-start-args: --container-runtime=docker
            os: ubuntu-24.04
            arch: amd64
          - name: baremetal-docker-ubuntu-24.04-arm
            driver: none
            cruntime: docker
            extra-start-args: --container-runtime=docker
            os: ubuntu-24.04-arm
            arch: arm64
          - name: baremetal-containerd-ubuntu-24.04-x86
            driver: none
            cruntime: containerd
            os: ubuntu-24.04
            arch: amd64
            extra-start-args: --container-runtime=containerd
          - name: baremetal-containerd-ubuntu-24.04-arm
            driver: none
            cruntime: containerd
            os: ubuntu-24.04-arm
            arch: arm64
            extra-start-args: --container-runtime=containerd
    steps:
      - id: info-block
        uses: medyagh/info-block@f5c042624acf8ce21bed4b0de77962e0a56ad88e # v1
        timeout-minutes: 1
      - name: Configure apt and update package index (ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        timeout-minutes: 1
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci.conf >/dev/null <<'EOF'
          Acquire::Retries "5";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          EOF
          sudo apt-get update
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        timeout-minutes: 2
        with:
          go-version: ${{env.GO_VERSION}}
          cache: true
      - name: Install gopogh
        timeout-minutes: 1
        uses: ./.github/actions/install-gopogh
      - name: Set up cgroup v2 delegation (rootless)
        if: ${{ matrix.rootless }}
        timeout-minutes: 1
        run: |
          sudo mkdir -p /etc/systemd/system/user@.service.d
          cat <<EOF | sudo tee /etc/systemd/system/user@.service.d/delegate.conf
          [Service]
          Delegate=cpu cpuset io memory pids
          EOF
          sudo systemctl daemon-reload
      - name: Set up Rootless Docker (rootless)
        if: ${{ matrix.rootless }}
        timeout-minutes: 3
        run: |
          sudo apt-get remove moby-engine-*
          curl https://get.docker.com | sudo sh
          dockerd-rootless-setuptool.sh install -f
          docker context use rootless
      - name: Install cri_dockerd (baremetal only)
        shell: bash
        if: matrix.driver == 'none' && matrix.cruntime == 'docker'
        timeout-minutes: 1
        run: |
          CRI_DOCKERD_VERSION="v0.4.3"
          ARCH="${{ matrix.arch }}"
          VERSION="${CRI_DOCKERD_VERSION#v}"
          curl -L "https://github.com/Mirantis/cri-dockerd/releases/download/${CRI_DOCKERD_VERSION}/cri-dockerd-${VERSION}.${ARCH}.tgz" -o /tmp/cri-dockerd.tgz
          tar -C /tmp -xzvf /tmp/cri-dockerd.tgz
          sudo mv /tmp/cri-dockerd/cri-dockerd /usr/bin/cri-dockerd
          sudo curl -L "https://raw.githubusercontent.com/Mirantis/cri-dockerd/${CRI_DOCKERD_VERSION}/packaging/systemd/cri-docker.socket" -o /usr/lib/systemd/system/cri-docker.socket
          sudo curl -L "https://raw.githubusercontent.com/Mirantis/cri-dockerd/${CRI_DOCKERD_VERSION}/packaging/systemd/cri-docker.service" -o /usr/lib/systemd/system/cri-docker.service
          sudo chmod +x /usr/bin/cri-dockerd
      - name: Install crictl (baremetal only)
        shell: bash
        if: matrix.driver == 'none'
        timeout-minutes: 1
        run: |
          CRICTL_VERSION="v1.35.0"
          ARCH="${{ matrix.arch }}"
          CRICTL_TAR="crictl-${CRICTL_VERSION}-linux-${ARCH}.tar.gz"
          curl -L "https://github.com/kubernetes-sigs/cri-tools/releases/download/${CRICTL_VERSION}/${CRICTL_TAR}" --output "${CRICTL_TAR}"
          sudo tar zxvf "${CRICTL_TAR}" -C /usr/local/bin
      # conntrack is required for kubernetes 1.18 and higher
      - name: Install conntrack (baremetal only)
        shell: bash
        if: matrix.driver == 'none'
        timeout-minutes: 2
        run: sudo apt-get -y install conntrack
      # socat is required for kubectl port forward which is used in some tests
      - name: Install socat (baremetal only)
        shell: bash
        if: matrix.driver == 'none'
        timeout-minutes: 1
        run: sudo apt-get -y install socat
      - name: Install container networking plugins (baremetal only)
        shell: bash
        if: matrix.driver == 'none'
        timeout-minutes: 1
        run: |
          CNI_PLUGIN_VERSION="v1.9.1"
          ARCH="${{ matrix.arch }}"
          CNI_PLUGIN_TAR="cni-plugins-linux-${ARCH}-$CNI_PLUGIN_VERSION.tgz"
          CNI_PLUGIN_INSTALL_DIR="/opt/cni/bin"
          curl -LO "https://github.com/containernetworking/plugins/releases/download/$CNI_PLUGIN_VERSION/$CNI_PLUGIN_TAR"
          sudo mkdir -p "$CNI_PLUGIN_INSTALL_DIR"
          sudo tar -xf "$CNI_PLUGIN_TAR" -C "$CNI_PLUGIN_INSTALL_DIR"
          rm "$CNI_PLUGIN_TAR"
      - name: Install docker-cli
        timeout-minutes: 1
        run: |
          set -x
          echo "=== Docker Version ==="
          docker version || true
          echo "=== Docker Info ==="
          docker info || true

          echo "=== Docker Disk Usage ==="
          docker system df || true

          echo "=== Docker System Info (JSON) ==="
          docker system info --format='{{json .}}' | { command -v jq >/dev/null 2>&1 && jq . || cat; } || true

          echo "=== Running Containers ==="
          docker ps -a || true

          echo "=== Images ==="
          docker images || true
      - name: Install podman
        if: matrix.driver == 'podman'
        shell: bash
        timeout-minutes: 1
        run: |
          sudo apt install -y podman
          lsb_release -a || true
          echo "=== podman version ==="
          podman version || true
          echo "=== podman info ==="
          podman info || true
          echo "=== podman system df ==="
          podman system df || true
          echo "=== podman system info (JSON) ==="
          podman system info --format='{{json .}}' || true
          echo "=== podman ps ==="
          podman ps || true
      - name: Install kubectl
        timeout-minutes: 1
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
      - name: Download Test Binaries
        timeout-minutes: 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: binaries-${{ matrix.arch }}
      - name: Disable AppArmor for MySQL
        if: runner.os == 'Linux'
        timeout-minutes: 1
        run: |
          sudo ln -s /etc/apparmor.d/usr.sbin.mysqld /etc/apparmor.d/disable/
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld
      - name: Install containerd (baremetal only)
        if: matrix.driver == 'none' && matrix.cruntime == 'containerd'
        timeout-minutes: 2
        run: |
          sudo apt-get install -y containerd
          # Configure containerd
          sudo mkdir -p /etc/containerd
          containerd config default | sudo tee /etc/containerd/config.toml
          sudo systemctl restart containerd
      - name: Run Functional Test
        id: run_test
        continue-on-error: true
        shell: bash
        timeout-minutes: 18
        run: |
          set -x
          mkdir -p report
          chmod a+x ./e2e-*
          chmod a+x ./minikube-*
          ./minikube-$(go env GOOS)-$(go env GOARCH) delete --all --purge
          START_TIME=$(date -u +%s)
          # -test.timeout=0 disables the go test timeout; the step timeout-minutes above enforces the actual deadline
          ./e2e-$(go env GOOS)-$(go env GOARCH) -minikube-start-args=" --driver=${{ matrix.driver }} ${{ matrix.extra-start-args }} -v=6 --alsologtostderr"  -test.run TestFunctional -test.timeout=0 -test.v -binary=./minikube-$(go env GOOS)-$(go env GOARCH) 2>&1 | tee ./report/testout.txt
          END_TIME=$(date -u +%s)
          TIME_ELAPSED=$(($END_TIME-$START_TIME))
          min=$((${TIME_ELAPSED}/60))
          sec=$((${TIME_ELAPSED}%60))
          TIME_ELAPSED="${min} min $sec seconds "
          # make variables available for next step
          echo "TIME_ELAPSED=${TIME_ELAPSED}" >> $GITHUB_ENV
      - name: Convert Test Output to JSON
        if: always()
        timeout-minutes: 1
        shell: bash
        run: go tool test2json -t < ./report/testout.txt > ./report/testout.json || true
      - name: Generate Gopogh HTML Report
        uses: ./.github/actions/generate-report
        timeout-minutes: 1
        if: always()
        with:
          json_report_path: './report/testout.json'
          report_dir: './report'
          report_title: "${{ matrix.name }} ${GITHUB_REF}"
          artifact_name_suffix: "${{ matrix.name }}"
          time_elapsed: "${{ env.TIME_ELAPSED }}"
          check_strict: 'true'
          test_outcome: "${{ steps.run_test.outcome }}"
          test_text_path: './report/testout.txt'
