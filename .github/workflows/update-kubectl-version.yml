name: "update-kubectl-version"
on:
  workflow_dispatch:
  schedule:
    # every Saturday at 1:00 Pacific/8:00 UTC
    - cron: "0 8 * * 6"
permissions:
  contents: read

jobs:
  bump-kubectl-version:
    uses: ./.github/workflows/update-dependency.yml
    with:
      dep: kubectl
      title: "Addon kubevirt: Update bitnami/kubectl image from {OLD_VERSION} to {NEW_VERSION}"
      labels: ok-to-test
      release-url: https://github.com/bitnami/containers
      workflow-file: update-kubectl-version.yml
    secrets: inherit
