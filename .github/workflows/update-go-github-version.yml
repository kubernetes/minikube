name: "update-go-github-version"
on:
  workflow_dispatch:
  schedule:
    # every Saturday at 1:00 Pacific/8:00 UTC
    - cron: "0 8 * * 6"
permissions:
  contents: read

jobs:
  bump-go-github-version:
    uses: ./.github/workflows/update-dependency.yml
    with:
      dep: go-github
      title: "CI: update go-github from {OLD_VERSION} to {NEW_VERSION}"
      commit-message: "Update go-github from {OLD_VERSION} to {NEW_VERSION}"
      branch: auto_bump_go_github_version
      release-url: https://github.com/google/go-github
      workflow-file: update-go-github-version.yml
    secrets: inherit
