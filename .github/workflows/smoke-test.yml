# Boot Smoke Test only tests Bare VM (start,stop,delete) and not any minikube/kubernetes functionality.
name: Smoke Test
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - "go.mod"
      - "**.go"
      - "Makefile"
      - "!hack/**"
      - "!site/**"
      - "!**.md"
      - "!**.json"
  pull_request:
    paths:
      - "go.mod"
      - "**.go"
      - "Makefile"
      - ".github/workflows/smoke-test.yml"
      - "!hack/**"
      - "!site/**"
      - "!**.md"
      - "!**.json"
env:
  GOPROXY: https://proxy.golang.org
  LOG_ARGS: --v=8 --alsologtostderr

permissions:
  contents: read
# Limit one unit test job running per PR/Branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # For example, if you push multiple commits to a pull request in quick succession, only the latest workflow run will continue
  cancel-in-progress: true
jobs:
  minikube-vm-boot:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vfkit-containerd-macos-15-x86
            driver: vfkit
            os: macos-15-intel
            start_flags: --network vmnet-shared --force --container-runtime=containerd
            sudo: "sudo"
          - name: docker-containerd-ubuntu-24.04-x86
            driver: docker
            os: ubuntu-24.04
            start_flags: --container-runtime=containerd
            sudo: ""
          - name: docker-containerd-ubuntu-24.04-arm
            driver: docker
            os: ubuntu-24.04-arm
            start_flags: --container-runtime=containerd
            sudo: ""
    steps:
      - id: info-block
        uses: medyagh/info-block@f5c042624acf8ce21bed4b0de77962e0a56ad88e # v1
        timeout-minutes: 1
      - name: Disable spotlight indexing (macos)
        timeout-minutes: 1
        if: contains(matrix.os, 'macos')
        run: |
          # Disable indexing globally
          sudo mdutil -a -i off
          # Erase Existing Indexes
          sudo mdutil -E /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        timeout-minutes: 1
        with:
          go-version-file: go.mod
          cache: true
      - name: Download minikube binaries
        uses: actions/download-artifact@d7d2b6b31ede9d1091053d87d2c74921a1f0ddecfc
        timeout-minutes: 2
        with:
          pattern: minikube-*
          path: out
          merge-multiple: true
      - name: Prepare binary
        timeout-minutes: 1
        run: |
          ls -lh out/ || true
          find out -type f | head -n 20 || true
          chmod +x out/minikube-* 2>/dev/null || true
          BIN="out/minikube-$(go env GOOS)-$(go env GOARCH)"
          if [ ! -f "$BIN" ]; then BIN=$(ls out/minikube-* | head -n1); fi
          echo "Using $BIN -> out/minikube"
          cp -f "$BIN" out/minikube
          chmod +x out/minikube
          ./out/minikube version
      - name: Update brew (macos)
        timeout-minutes: 5
        if: contains(matrix.os, 'macos')
        run: brew update
      - name: Install tools (macos)
        timeout-minutes: 1
        if: contains(matrix.os, 'macos')
        run: brew install tree
      - name: Install vfkit and vmnet-helper (macos)
        timeout-minutes: 1
        if: matrix.driver == 'vfkit'
        run: |
          brew install vfkit
          curl -fsSL https://github.com/minikube-machine/vmnet-helper/releases/latest/download/install.sh | sudo VMNET_INTERACTIVE=0 bash
      - name: Inspect host before test (macos)
        timeout-minutes: 1
        if: contains(matrix.os, 'macos')
        run: |
          echo "=== Top ==="
          top -l 2 -s 10 -n 20 -stats pid,command,cpu,time,mem
          echo "=== Interfaces ==="
          ifconfig -u
          echo "=== Routing table ==="
          netstat -rn -f inet
          echo "=== Packet Filter ==="
          sudo pfctl -s all || true
      - name: Start minikube (1st boot)
        timeout-minutes: 16
        run: |
          ${{ matrix.sudo }} ./out/minikube start \
              ${{ env.LOG_ARGS }} \
              --no-kubernetes \
              --cpus 2 \
              --memory 3gb \
              --driver ${{ matrix.driver }} \
              ${{ matrix.start_flags }}
      - name: Inspect host after test (macos)
        timeout-minutes: 1
        if: always() && contains(matrix.os, 'macos')
        run: |
          echo "=== Top ==="
          top -l 2 -s 10 -n 20 -stats pid,command,cpu,time,mem
          echo "=== Interfaces ==="
          ifconfig -u
          echo "=== Routing table ==="
          netstat -rn -f inet
          echo "=== Packet Filter ==="
          sudo pfctl -s all || true
      - name: Inspect minikube
        timeout-minutes: 1
        if: always()
        run: |
          ${{ matrix.sudo }} tree -h ~/.minikube
          machine="$HOME/.minikube/machines/minikube"
          machine_logs=$(${{ matrix.sudo }} find "$machine" -name "*.log")
          minikube_logs="$HOME/.minikube/logs/lastStart.txt"
          for f in $machine_logs $minikube_logs /var/db/dhcpd_leases; do
            echo "==> $f <=="
            ${{ matrix.sudo }} head -n 1000 "$f" || true
          done
      - name: Stop minikube
        timeout-minutes: 1
        run: ${{ matrix.sudo }} ./out/minikube stop ${{ env.LOG_ARGS }}
      - name: Start minikube again (2nd boot)
        timeout-minutes: 14
        run: ${{ matrix.sudo }} ./out/minikube start ${{ env.LOG_ARGS }} ${{ matrix.start_flags }}
      - name: Delete minikube
        timeout-minutes: 1
        run: ${{ matrix.sudo }} ./out/minikube delete ${{ env.LOG_ARGS }}
