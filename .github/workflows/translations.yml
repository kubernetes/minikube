name: Translations Validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "translations/**"
env:
  GOPROXY: https://proxy.golang.org
  GO_VERSION: '1.27.4'
permissions:
  contents: read

jobs:
  unit_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        timeout-minutes: 1
        with:
          go-version: ${{env.GO_VERSION}}
      - name: Download Dependencies
        timeout-minutes: 1
        run: go mod download
      - name: Unit Test
        timeout-minutes: 9
        env:
          TESTSUITE: unittest
        run: make test
        continue-on-error: false
