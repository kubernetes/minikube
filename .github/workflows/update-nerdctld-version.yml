name: "update-nerdctld-version"
on:
  workflow_dispatch:
  schedule:
    # every Saturday at 1:00 Pacific/8:00 UTC
    - cron: "0 8 * * 6"
permissions:
  contents: read

jobs:
  bump-nerdctld-version:
    uses: ./.github/workflows/update-dependency.yml
    with:
      dep: nerdctld
      title: "Kicbase: Update nerdctld from {OLD_VERSION} to {NEW_VERSION}"
      branch-suffix: short-commit-hash
      release-url: https://github.com/afbjorklund/nerdctld/releases
      ok-to-build-image: true
      workflow-file: update-nerdctld-version.yml
    secrets: inherit
