name: "update-cni-plugins-version"
on:
  workflow_dispatch:
  schedule:
    # every Saturday at 1:00 Pacific/8:00 UTC
    - cron: "0 8 * * 6"
permissions:
  contents: read

jobs:
  bump-cni-plugins-version:
    uses: ./.github/workflows/update-dependency.yml
    with:
      dep: cni-plugins
      title: "Kicbase/ISO: Update cni-plugins from {OLD_VERSION} to {NEW_VERSION}"
      branch: auto_bump_cni_plugins_version
      branch-suffix: short-commit-hash
      release-url: https://github.com/containernetworking/plugins/releases
      ok-to-build-image: true
      ok-to-build-iso: true
      workflow-file: update-cni-plugins-version.yml
    secrets: inherit
