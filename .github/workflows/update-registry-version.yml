name: "update-registry-version"
on:
  workflow_dispatch:
  schedule:
    # every Saturday at 1:00 Pacific/8:00 UTC
    - cron: "0 8 * * 6"
permissions:
  contents: read

jobs:
  bump-registry-version:
    uses: ./.github/workflows/update-dependency.yml
    with:
      dep: registry
      title: "Addon registry: Update registry image from {OLD_VERSION} to {NEW_VERSION}"
      labels: ok-to-test
      workflow-file: update-registry-version.yml
    secrets: inherit
