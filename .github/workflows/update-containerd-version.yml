name: "update-containerd-version"
on:
  workflow_dispatch:
  schedule:
    # every Saturday at 1:00 Pacific/8:00 UTC
    - cron: "0 8 * * 6"
permissions:
  contents: read

jobs:
  bump-containerd-version:
    uses: ./.github/workflows/update-dependency.yml
    with:
      dep: containerd
      title: "Kicbase/ISO: Update containerd from {OLD_VERSION} to {NEW_VERSION}"
      branch-suffix: short-commit-hash
      release-url: https://github.com/containerd/containerd/releases
      ok-to-build-image: true
      ok-to-build-iso: true
      workflow-file: update-containerd-version.yml
    secrets: inherit
